spring:
  profiles:
    include: rabbitmq
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin
    url: jdbc:postgresql://localhost:28072/backend_db
  liquibase:
    changeLog: classpath:/db/db.changelog-master.xml
    databaseChangeLogTable: _databasechangelog
    databaseChangeLogLockTable: _databasechangeloglock
  application:
    name: backend-application

rabbitmq:
  exchanges:
    user-qr-gen-event:
      name: user-qr-gen-event

  queues:
    user-qr-gen-queue:
      name: user-qr-gen-queue
  application:
    name: backend-application
  profiles:
    include: rabbitmq
server:
  port: 8070

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
