spring:
  profiles:
    include: rabbitmq
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin
    url: jdbc:postgresql://localhost:28072/backend_db
  liquibase:
    changeLog: classpath:/db/db.changelog-master.xml
    databaseChangeLogTable: _databasechangelog
    databaseChangeLogLockTable: _databasechangeloglock
  application:
    name: backend-application

rabbitmq:
  exchanges:
    user-qr-gen-event:
      name: user-qr-gen-event

  queues:
    user-qr-gen-queue:
      name: user-qr-gen-queue
  application:
    name: backend-application
  profiles:
    include: rabbitmq
server:
  port: 8070

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logstash:
  host: ${LOGSTASH_URL:localhost:5000}  # Можно переопределить через переменную окружения

# Окружение
app:
  environment: ${ENVIRONMENT:dev}

# Логирование
logging:
  level:
    root: INFO
    com.mark.backend_application: DEBUG

# Для Sleuth (traceId)
spring.sleuth:
  sampler:
    probability: 1.0  # В dev - 100%, в prod - 0.1 (10%)
  web:
    skip-pattern: /actuator/health|/actuator/info

# Для Micrometer Tracing (Spring Boot 3)
management:
  tracing:
    sampling:
      probability: 1.0
