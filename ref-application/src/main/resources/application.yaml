spring:
  application:
    name: ref-application
  profiles:
    include: rabbitmq
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin
    url: jdbc:postgresql://localhost:28071/ref_db
  liquibase:
    changeLog: classpath:/db/ref/application/db.changelog-master.xml
    databaseChangeLogTable: _databasechangelog
    databaseChangeLogLockTable: _databasechangeloglock
server:
  port: 8090

logstash:
  host: ${LOGSTASH_URL:localhost:5000}  # Можно переопределить через переменную окружения

# Окружение
app:
  environment: ${ENVIRONMENT:dev}

# Регистрация сервиса в дискавери
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true


# Параметры подключения бота
telegram-bot:
  token: "7970425134:AAEX4NYK5UfYmn_KTjEH1HqkNaD9sgAxW8E"

# Логирование
logging:
  level:
    root: INFO
    com.ref.application: DEBUG

# Для Sleuth (traceId)
spring.sleuth:
  sampler:
    probability: 1.0  # В dev - 100%, в prod - 0.1 (10%)
  web:
    skip-pattern: /actuator/health|/actuator/info

# Для Micrometer Tracing (Spring Boot 3)
management:
  tracing:
    sampling:
      probability: 1.0