version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4.0.7-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rmuser
      RABBITMQ_DEFAULT_PASS: rmpassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '15672:15672'
      - '5672:5672'

  ref-application-db:
    image: postgres:15
    container_name: ref-db
    user: root
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'ref_db'
    healthcheck:
      test: pg_isready -U $$POSTGRESQL_USERNAME
    ports:
      - '28071:5432'
    volumes:
      - ./.volumes/ref-db/pgdata:/var/lib/postgresql/data

  backend-application-db:
    image: postgres:15
    container_name: backend-db
    user: root
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'backend_db'
    healthcheck:
      test: pg_isready -U $$POSTGRESQL_USERNAME
    ports:
      - '28072:5432'
    volumes:
      - ./.volumes/backend-db/pgdata:/var/lib/postgresql/data
volumes:
  rabbitmq_data: